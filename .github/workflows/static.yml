name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare publish directory
        run: |
          if [ -d ".output/public" ]; then
            echo "Using .output/public"
            echo "PUBLISH_DIR=.output/public" >> "$GITHUB_ENV"
            ls -la .output/public
          elif [ -d "dist" ]; then
            echo "Using dist"
            echo "PUBLISH_DIR=dist" >> "$GITHUB_ENV"
            ls -la dist
          else
            echo "No build output found (.output/public or dist)" && exit 1
          fi

      - name: Generate Pages entry files from current build output
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ.get('PUBLISH_DIR', '.output/public'))
          if not root.exists():
              raise SystemExit(f'No build output directory found at {root}')

          assets = root / 'assets'
          js_files = sorted(assets.glob('index-*.js'))
          css_files = sorted(assets.glob('styles-*.css'))

          if not js_files:
              print(f'No index-*.js files found under {assets}. Listing contents:')
              for child in sorted(assets.iterdir()):
                  print(' -', child.name)
              raise SystemExit(1)

          js_file = js_files[0].name
          css_file = css_files[0].name if css_files else None
          css_link = f'  <link rel="stylesheet" href="assets/{css_file}">' if css_file else ''

          html = f'''<!doctype html>
          <html>
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <base href="/Wedding-Repository/">
            <title>Gajendra & Bhakti — Invitation</title>
          {css_link}
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="assets/{js_file}"></script>
          </body>
          </html>
          '''

          (root / 'index.html').write_text(html, encoding='utf-8')
          (root / '404.html').write_text(html, encoding='utf-8')
          print(f'Wrote index.html/404.html with script assets/{js_file}')
          PY

      - name: Verify Pages artifact content
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          root = Path(os.environ.get('PUBLISH_DIR', '.output/public'))
          idx = root / 'index.html'
          if not idx.exists():
              raise SystemExit(f'ERROR: missing {idx}')

          text = idx.read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]+)"', text)
          if not match:
              raise SystemExit(f'ERROR: no script tag found in {idx}')

          script = root / match.group(1)
          if not script.exists():
              raise SystemExit(f'ERROR: referenced script does not exist: {script}')

          print(f'Verified index.html references existing script: {match.group(1)}')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
