name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare publish directory
        run: |
          if [ -d ".output/public" ]; then
            echo "Using .output/public"
            echo "PUBLISH_DIR=.output/public" >> "$GITHUB_ENV"
            ls -la .output/public
          elif [ -d "dist" ]; then
            echo "Using dist"
            echo "PUBLISH_DIR=dist" >> "$GITHUB_ENV"
            ls -la dist
          else
            echo "No build output found (.output/public or dist)" && exit 1
          fi

      - name: Ensure 404.html exists
        run: |
          root="${PUBLISH_DIR:-.output/public}"
          if [ -f "$root/index.html" ] && [ ! -f "$root/404.html" ]; then
            cp "$root/index.html" "$root/404.html"
            echo "Copied index.html to 404.html"
          fi

      - name: Verify Pages artifact content
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          root = Path(os.environ.get('PUBLISH_DIR', '.output/public'))
          idx = root / 'index.html'
          if not idx.exists():
              raise SystemExit(f'ERROR: missing {idx}')

          text = idx.read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]+)"', text)
          if not match:
              raise SystemExit(f'ERROR: no script tag found in {idx}')

          src_path = match.group(1)
          if src_path.startswith('/Wedding-Repository/'):
              src_path = src_path[len('/Wedding-Repository/'):]
          src_path = src_path.lstrip('/')

          script = root / src_path
          if not script.exists():
              raise SystemExit(f'ERROR: referenced script does not exist: {script}')

          print(f'Verified index.html references existing script: {match.group(1)} -> {script}')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
