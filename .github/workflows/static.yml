name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare publish directory (supports .output/public or dist)
        run: |
          rm -rf public_out || true
          if [ -d ".output/public" ]; then
            echo "Using .output/public"
            mkdir -p public_out
            cp -a .output/public/. public_out/
          elif [ -d "dist" ]; then
            echo "Using dist"
            mkdir -p public_out
            cp -a dist/. public_out/
          else
            echo "No build output found (dist or .output/public)" && exit 1
          fi

      - name: Generate index.html fallback for Pages (if missing)
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('public_out')
          if (out / 'index.html').exists():
              print('index.html already present')
              raise SystemExit(0)

          assets_dir = out / 'assets'
          js_files = sorted(p.name for p in assets_dir.glob('index-*.js'))
          css_files = sorted(p.name for p in assets_dir.glob('styles-*.css'))

          if not js_files:
              print('No index-*.js found in assets; listing assets:')
              for p in sorted(assets_dir.iterdir()):
                  print(' -', p.name)
              raise SystemExit(1)

          js_file = js_files[0]
          css_file = css_files[0] if css_files else None
          css_link = f'  <link rel="stylesheet" href="assets/{css_file}">' if css_file else ''

          html = f'''<!doctype html>
          <html>
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <base href="/Wedding-Repository/">
            <title>Gajendra & Bhakti — Invitation</title>
          {css_link}
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="assets/{js_file}"></script>
          </body>
          </html>
          '''

          (out / 'index.html').write_text(html, encoding='utf-8')
          print(f'Generated public_out/index.html referencing assets/{js_file}')

          if not (out / '404.html').exists():
              (out / '404.html').write_text(html, encoding='utf-8')
              print('Generated public_out/404.html as SPA fallback')
          PY

      - name: Verify publish directory and index references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out = Path('public_out')
          idx = out / 'index.html'
          if not idx.exists():
              print(f'ERROR: {idx} not found')
              raise SystemExit(1)

          text = idx.read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]+)"', text)
          if not match:
              print(f'ERROR: no script src found in {idx}')
              raise SystemExit(1)

          script_src = match.group(1)
          script_path = out / script_src
          print(f'Index references script: {script_src}')
          if not script_path.exists():
              print(f'ERROR: referenced script {script_path} is missing')
              for child in sorted((out / 'assets').iterdir()):
                  print(' -', child.name)
              raise SystemExit(1)

          print('Publish directory verification passed: index.html references an existing asset.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
