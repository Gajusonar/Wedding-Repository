name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Give the workflow permission to write Pages artifacts and deploy
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare publish directory (supports .output/public or dist)
        run: |
          rm -rf public_out || true
          if [ -d ".output/public" ]; then
            echo "Using .output/public"
            mkdir -p public_out
            cp -a .output/public/. public_out/
          elif [ -d "dist" ]; then
            echo "Using dist"
            mkdir -p public_out
            cp -a dist/. public_out/
          else
            echo "No build output found (dist or .output/public)" && exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
